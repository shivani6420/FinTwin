<div id="app">
  <div id="stage"><router-outlet /></div>
  <nav id="tabs" [class.hide]="!showTabs()">
    <button routerLink="/home" routerLinkActive="on">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home
    </button>
    <button class="plus" routerLink="/pick" aria-label="New stress test">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button routerLink="/history" routerLinkActive="on">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History
    </button>
    <button routerLink="/me" routerLinkActive="on">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Me
    </button>
  </nav>
  <app-safer-sheet />
</div>
