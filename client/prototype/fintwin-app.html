<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinTwin app</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{--bg:#f4f1ff;--c:#fff;--ink:#1a1033;--sh:#1a1033;--m:#6b6488;--p:#6c4dff;--y:#ffd23f;--bad:#ff4d6d;--mid:#ffb020;--ok:#17b26a;--ln:#ddd6f5;--out:#e4def9;--hd:"Bricolage Grotesque",system-ui,sans-serif;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112b;--c:#221b45;--ink:#efeaff;--sh:#080614;--m:#a49cc9;--p:#8f78ff;--ln:#352d63;--out:#0e0a20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15112b;--c:#221b45;--ink:#efeaff;--sh:#080614;--m:#a49cc9;--p:#8f78ff;--ln:#352d63;--out:#0e0a20;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--out);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100%;display:flex;justify-content:center;align-items:center;min-height:100dvh}
#app{position:relative;width:100%;max-width:410px;height:100dvh;max-height:860px;background:var(--bg);overflow:hidden}
@media(min-width:520px){#app{border-radius:38px;border:3px solid var(--ink);box-shadow:0 10px 0 var(--sh);height:min(860px,calc(100dvh - 40px))}}
#stage{position:absolute;inset:0}.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:22px 20px 110px;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.scr.r{transform:translateX(100%)}.scr.l{transform:translateX(-28%)}
h1{font:800 30px/1.08 var(--hd);margin:0 0 8px;letter-spacing:-.02em}h2{font:800 22px var(--hd);margin:0 0 6px}p{margin:0 0 14px;color:var(--m)}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.btn{width:100%;background:var(--y);color:#1a1033;border:2.5px solid var(--ink);border-radius:18px;padding:15px;font:800 18px var(--hd);box-shadow:0 5px 0 var(--sh);transition:transform .08s,box-shadow .08s;margin-top:10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}.btn.alt{background:var(--c);color:var(--ink)}
.lnk{background:none;border:0;color:var(--m);text-decoration:underline;padding:10px;width:100%}
.card{background:var(--c);border:2px solid var(--ink);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--sh);margin-bottom:16px}
.c{text-align:center;display:flex;flex-direction:column;align-items:center;min-height:100%;justify-content:center}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0 16px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--ln)}.dots i.on{background:var(--p);width:26px;border-radius:6px}
.bub{background:var(--c);border:2px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:600;position:relative;margin-bottom:12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{width:42px;height:42px;border-radius:14px;border:2px solid var(--ink);background:var(--c);box-shadow:0 3px 0 var(--sh);font-size:20px;font-weight:800}
.big{font:800 52px/1 var(--hd);color:var(--p);text-align:center;margin:10px 0 6px}
.sl label{display:flex;justify-content:space-between;font-weight:700;margin-top:14px}.sl output{color:var(--p);font:800 18px var(--hd)}.sl small{color:var(--m);display:block}
input[type=range]{width:100%;accent-color:var(--p);height:30px;margin:4px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{background:var(--c);border:2px solid var(--ink);border-radius:20px;padding:16px 12px;text-align:left;box-shadow:0 4px 0 var(--sh);display:grid;gap:6px;transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}.tile svg{width:34px;height:34px;stroke:var(--p);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.tile b{font:800 17px/1.15 var(--hd)}.tile span{font-size:13px;color:var(--m)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none;border:2px solid var(--ink);background:var(--c);border-radius:99px;padding:8px 14px;font-weight:700;box-shadow:0 3px 0 var(--sh)}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0}.stat b{font:800 22px var(--hd)}
.vd{border:2.5px solid var(--ink);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--sh);margin-bottom:16px;color:#fff}.vd.bad{background:var(--bad)}.vd.mid{background:var(--mid);color:#1a1033}.vd.ok{background:var(--ok)}
.vd h2{font-size:26px;margin:0 0 4px}.vd p{color:inherit;margin:0;opacity:.95}
.dg{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-top:12px}.dg i{aspect-ratio:1;border-radius:50%;background:currentColor;opacity:.3}.dg i.x{opacity:1;background:#fff}.vd.mid .dg i.x{background:#1a1033}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.tl div{background:var(--c);border:2px solid var(--ink);border-radius:16px;padding:10px 12px}.tl b{display:block;font:800 20px var(--hd)}.tl span{font-size:12.5px;color:var(--m)}
svg.ch{width:100%;display:block;touch-action:pan-y}svg text{font-size:10.5px;fill:var(--m)}svg .lb{font-weight:700}.gr{stroke:var(--ln)}.fut{fill:none;stroke:var(--p);opacity:.13}.fut.n{stroke:var(--bad);opacity:.28}.zone{fill:var(--bad);opacity:.1}
.ln{fill:none;stroke-width:2.8;stroke-linecap:round}.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .9s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
#rd{font-size:13.5px;min-height:2.8em;color:var(--m);margin-top:6px}
.hist{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-bottom:12px;background:var(--c);border:2px solid var(--ink);border-radius:18px;padding:12px;box-shadow:0 3px 0 var(--sh)}
.badge{flex:none;min-width:58px;text-align:center;border-radius:12px;padding:6px;font:800 15px var(--hd);color:#fff}.badge.bad{background:var(--bad)}.badge.mid{background:var(--mid);color:#1a1033}.badge.ok{background:var(--ok)}
#tabs{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;background:var(--c);border-top:2.5px solid var(--ink);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));transition:transform .3s}
#tabs.hide{transform:translateY(120%)}#tabs button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--m);padding:4px 14px}#tabs button.on{color:var(--p)}
#tabs svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs .plus{width:62px;height:62px;border-radius:50%;background:var(--y);border:2.5px solid var(--ink);color:#1a1033;margin-top:-30px;box-shadow:0 4px 0 var(--sh);padding:0;display:grid;place-items:center}#tabs .plus:active{transform:translateY(3px)}#tabs .plus svg{width:30px;height:30px;stroke-width:3}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--c);border-top:2.5px solid var(--ink);border-radius:26px 26px 0 0;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:5}#sheet.open{transform:none}
.pb{height:14px;border:2px solid var(--ink);border-radius:9px;overflow:hidden;width:80%;background:var(--c)}.pb i{display:block;height:100%;background:var(--p);width:0;transition:width 2.3s linear}
.wob{animation:wob .5s ease-in-out infinite alternate}@keyframes wob{to{transform:translateY(-8px) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.scr,#tabs,#sheet,.pb i{transition:none}.dr,.wob{animation:none;stroke-dashoffset:0}}
</style></head><body><div id="app"><div id="stage"></div>
<nav id="tabs" class="hide"><button data-go="home" data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
<button class="plus" data-go="pick" aria-label="New stress test"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<button data-go="hist" data-t="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
<button data-go="me" data-t="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Me</button></nav>
<div id="sheet" role="dialog" aria-label="Make it safer"></div></div>
<script>
const $=s=>document.querySelector(s),M=24,W=25,N=500,st=$("#stage");
const inr=n=>new Intl.NumberFormat("en-IN",{maximumFractionDigits:0}).format(Math.round(n)),money=n=>(n<0?"−":"")+"₹"+inr(Math.abs(n));
const sh=n=>{const a=Math.abs(n),s=n<0?"−":"";return a>=1e5?s+"₹"+(a/1e5).toFixed(1).replace(/\.0$/,"")+"L":s+"₹"+Math.round(a/1e3)+"k"};
let S={earn:75000,spend:35000,loan:20000,saved:350000,cut:0,add:0},hist=[],done=false,sc="job",ob=0,edit=false,cur=null,name="home",seed=7,saved=false;
const SC={job:{n:"I lose my job",d:"No income for a while",q:"Months without income",min:1,max:12,step:1,v:6,f:v=>v+" months"},med:{n:"Medical emergency",d:"One big surprise bill",q:"Size of the bill",min:20000,max:500000,step:10000,v:200000,f:money},hike:{n:"Everything gets pricier",d:"Your spending jumps",q:"How much costs rise",min:5,max:50,step:5,v:20,f:v=>v+"%"},crash:{n:"Markets crash",d:"Savings take a hit",q:"Share of savings lost",min:10,max:60,step:5,v:30,f:v=>v+"%"}};
const IC={job:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',med:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>',hike:'<path d="M4 18l6-6 4 4 6-8"/><path d="M15 8h5v5"/>',crash:'<path d="M4 6l6 6 4-4 6 8"/><path d="M15 16h5v-5"/>'};
try{const j=JSON.parse(localStorage.getItem("ft-app")||"{}");if(j.S)S=Object.assign(S,j.S);hist=j.hist||[];done=!!j.done}catch(e){}
const save=()=>{try{localStorage.setItem("ft-app",JSON.stringify({S,hist,done}))}catch(e){}};
const IN=[{k:"earn",l:"You earn each month",min:10000,max:300000,step:1000},{k:"spend",l:"You spend each month",min:5000,max:200000,step:1000,h:"Food, rent, bills, everything"},{k:"loan",l:"Loan payments (EMIs)",min:0,max:100000,step:1000},{k:"saved",l:"Savings you could use",min:0,max:2000000,step:10000}];
const sl=(d,v,f)=>`<label for="s-${d.k}">${d.l}<output id="o-${d.k}">${f(v)}</output></label>${d.h?`<small>${d.h}</small>`:""}<input id="s-${d.k}" type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${v}" data-k="${d.k}">`;
const mood=r=>r<3?"bad":r<6?"mid":"ok";const runway=()=>S.saved/(S.spend+S.loan||1);
function twin(m,z=120,cls=""){const f={ok:"#17b26a",mid:"#ffb020",bad:"#ff4d6d"}[m],mo={ok:'<path d="M38 66q12 14 24 0" />',mid:'<path d="M40 70h20"/>',bad:'<path d="M38 74q12-12 24 0"/><path d="M72 40q4 8 0 12q-4-4 0-12" fill="#7dd3fc" stroke="#1a1033" stroke-width="2"/>'}[m];
return`<svg class="${cls}" width="${z}" height="${z}" viewBox="0 0 100 100" role="img" aria-label="Your twin looks ${m==="ok"?"happy":m==="mid"?"worried":"stressed"}"><circle cx="56" cy="54" r="38" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="5 5" opacity=".5"/><circle cx="50" cy="50" r="38" fill="${f}" stroke="#1a1033" stroke-width="3"/><circle cx="38" cy="44" r="4.5" fill="#1a1033"/><circle cx="62" cy="44" r="4.5" fill="#1a1033"/><g fill="none" stroke="#1a1033" stroke-width="3.2" stroke-linecap="round">${mo}</g></svg>`}
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},nz=r=>Math.sqrt(-2*Math.log(1-r()))*Math.cos(6.2831853*r());
function sim(k,v,fix){const r=rng(seed),P=new Float32Array(N*W),sv=S.saved+(fix?S.add:0),sp=Math.max(0,S.spend-(fix?S.cut:0));
for(let i=0;i<N;i++){let b=sv;P[i*W]=b;for(let m=0;m<M;m++){let inc=S.earn,ex=sp;if(k==="job"&&m<v)inc=0;if(k==="hike")ex*=1+v/100;ex*=1+.1*nz(r);b+=inc-ex-S.loan;if(m===0){if(k==="med")b-=v;if(k==="crash")b-=sv*v/100}P[i*W+m+1]=b}}
const L=[0,0,0].map(()=>new Float32Array(W)),mins=new Float32Array(N),f=[],c=new Float32Array(N);let hi=-1e12;
for(let i=0;i<N;i++){let mn=1e12,x=-1;for(let m=0;m<W;m++){const y=P[i*W+m];if(y<mn)mn=y;if(y>hi)hi=y;if(y<0&&x<0)x=m}mins[i]=mn;if(x>=0)f.push(x)}
for(let m=0;m<W;m++){for(let i=0;i<N;i++)c[i]=P[i*W+m];c.sort();[.1,.5,.9].forEach((q,j)=>L[j][m]=c[Math.floor(q*N)])}
mins.sort();f.sort((a,b)=>a-b);const low=mins[Math.floor(.05*N)];return{P,L,risk:f.length/N*100,med:f.length?f[f.length>>1]:null,buf:Math.max(0,Math.ceil(-low/1000)*1000),lo:mins[0],hi,end:L[1][M]}}
const rm=r=>r<10?"ok":r<50?"mid":"bad";
function chart(s){const vw=340,vh=230,L=44,R=62,T=8,B=22,pw=vw-L-R,ph=vh-T-B,lo=Math.min(0,s.lo),y0=lo-(s.hi-lo)*.05,y1=s.hi+(s.hi-lo)*.05,X=m=>L+m/M*pw,Y=v=>T+(y1-v)/(y1-y0)*ph;
let o=`<svg class="ch" id="svg" viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Chart of possible balances over 24 months">`;const q=(y1-y0)/4,e=10**Math.floor(Math.log10(q)),fr=q/e,u=(fr<=1?1:fr<=2?2:fr<=5?5:10)*e;
for(let v=Math.ceil(y0/u)*u;v<=y1;v+=u)o+=`<line class="gr" x1="${L}" x2="${L+pw}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-5}" y="${Y(v)+4}" text-anchor="end">${sh(v)}</text>`;
[0,12,24].forEach(m=>o+=`<text x="${X(m)}" y="${vh-6}" text-anchor="middle">${m?m+" mo":"Now"}</text>`);
o+=`<rect class="zone" x="${L}" y="${Y(0)}" width="${pw}" height="${Y(y0)-Y(0)}"/><text x="${L+4}" y="${Y(0)+13}" style="fill:var(--bad);font-weight:700">Out of money</text>`;
for(let i=0;i<N;i+=12){let d="",n=0;for(let m=0;m<W;m++){const v=s.P[i*W+m];if(v<0)n=1;d+=(m?"L":"M")+X(m)+" "+Y(v)}o+=`<path class="fut${n?" n":""}" d="${d}"/>`}
const cl=["var(--bad)","var(--p)","var(--ok)"],nm=["Tough","Likely","Lucky"],ys=[];
[2,1,0].forEach(j=>{let d="";for(let m=0;m<W;m++)d+=(m?"L":"M")+X(m)+" "+Y(s.L[j][m]);o+=`<path class="ln dr" pathLength="1" style="stroke:${cl[j]}" d="${d}"/>`;ys.push([Y(s.L[j][M]),j])});
let last=-99;ys.forEach(p=>{if(p[0]-last<13)p[0]=last+13;last=p[0]});ys.forEach(p=>o+=`<text class="lb" x="${L+pw+5}" y="${p[0]+4}" style="fill:${cl[p[1]]}">${nm[p[1]]}</text>`);
return o+`<line id="hv" x1="0" x2="0" y1="${T}" y2="${T+ph}" stroke="currentColor" opacity=".5" style="display:none"/></svg>`}
function dyn(){const c=SC[sc],s=sim(sc,c.v,true),r=Math.round(s.risk),m=rm(s.risk);window.R={s,vw:340,L:44,pw:234};
const h=m==="ok"?"You’d likely be fine.":m==="mid"?"It could get tight.":s.med!==null?`You’d run out of money around month ${s.med}.`:"You’d probably run out of money.";
const p=m==="ok"?`Safe in ${100-r} of 100 possible futures.`:`${r} of 100 possible futures run out of money.`;
$("#rs").innerHTML=`<div class="top" style="justify-content:center">${twin(m,110,m==="bad"?"wob":"")}</div><div class="vd ${m}" aria-live="polite"><h2>${h}</h2><p>${p}</p><div class="dg" aria-hidden="true">${Array.from({length:100},(_,i)=>`<i class="${i<r?"x":""}"></i>`).join("")}</div></div>
<div class="card"><h2 style="font-size:17px">Your next 2 years</h2><div id="sv">${chart(s)}</div><div id="rd">Touch the chart to read any month. Faint lines are single futures.</div></div>
<div class="tl"><div><b>${r} in 100</b><span>futures run out</span></div><div><b>${s.buf?money(s.buf):"None"}</b><span>extra savings to be 95% safe</span></div><div style="grid-column:1/3"><b>${money(s.end)}</b><span>you’d most likely have after 2 years</span></div></div>`;
const sv=$("#svg"),hv=$("#hv");if(sv){sv.onpointermove=ev=>{const b=sv.getBoundingClientRect(),mo=Math.max(0,Math.min(M,Math.round(((ev.clientX-b.left)/b.width*340-44)/234*M))),x=44+mo/M*234;hv.setAttribute("x1",x);hv.setAttribute("x2",x);hv.style.display="";
$("#rd").textContent=mo?`Month ${mo}: most likely ${money(s.L[1][mo])}. Tough case ${money(s.L[0][mo])}, lucky case ${money(s.L[2][mo])}.`:`Right now you have ${money(S.saved+S.add)}.`}}
if(!saved){saved=true;hist.unshift({sc,v:c.v,risk:r,ts:Date.now()});hist=hist.slice(0,30);save()}
$("#fxt")&&($("#fxt").textContent=S.cut||S.add?`Now ${r} in 100 run out of money.`:"Drag a slider and watch the result change.")}
const V={
ob(){const s=[["Meet your money twin","A digital copy of your finances. We test bad days on it, so the real you doesn’t have to.","ok"],["Pick a bad day","Job loss, a medical bill, rising prices, a market crash. Tap one and see what happens.","mid"],["See 100 possible futures","We play out your next two years again and again, and count how many end badly.","bad"]][ob];
return`<div class="c">${twin(s[2],170)}<h1 style="margin-top:14px">${s[0]}</h1><p>${s[1]}</p><div class="dots">${[0,1,2].map(i=>`<i class="${i===ob?"on":""}"></i>`).join("")}</div><button class="btn" data-act="obn">${ob<2?"Next":"Let’s start"}</button><button class="lnk" data-go="setup">Skip</button></div>`},
setup(){return`<div class="top">${edit?'<button class="back" data-act="back" aria-label="Back">‹</button>':""}<h1 style="margin:0">${edit?"Edit your twin":"Create your twin"}</h1></div><p>Four numbers is all it takes. Stays on your device.</p><div class="card sl">${IN.map(d=>sl(d,S[d.k],money)).join("")}</div><button class="btn" data-act="made">${edit?"Save changes":"Create my twin"}</button>`},
home(){const r=runway(),m=mood(r),left=S.earn-S.spend-S.loan,l=hist[0];
return`<p style="margin:0">Hi there</p><h1>Your money twin</h1><div style="display:flex;align-items:center;gap:6px">${twin(m,120)}<div class="bub">${r>=24?"I could last 2 years or more with no income.":`With no income, I could last about ${r.toFixed(1)} months.`}</div></div>
<div class="card"><div class="stat"><span>Left over each month</span><b>${money(left)}</b></div><div class="stat"><span>Savings</span><b>${money(S.saved)}</b></div></div>
<button class="btn" data-go="pick">Stress-test my twin</button><h2 style="margin-top:22px">Quick tests</h2><div class="chips">${Object.keys(SC).map(k=>`<button class="chip" data-go="cfg" data-sc="${k}">${SC[k].n}</button>`).join("")}</div>
${l?`<h2 style="margin-top:14px">Last test</h2><div class="hist"><span class="badge ${rm(l.risk)}">${l.risk}%</span><div><b>${SC[l.sc].n}</b><br><small style="color:var(--m)">${l.risk} in 100 futures ran out of money</small></div></div>`:""}`},
pick(){return`<div class="top"><button class="back" data-act="back" aria-label="Back">‹</button><h1 style="margin:0">What goes wrong?</h1></div><p>Pick one. It starts next month.</p><div class="grid">${Object.keys(SC).map(k=>`<button class="tile" data-go="cfg" data-sc="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg><b>${SC[k].n}</b><span>${SC[k].d}</span></button>`).join("")}</div>`},
cfg(){const c=SC[sc];return`<div class="top"><button class="back" data-act="back" aria-label="Back">‹</button><h1 style="margin:0;font-size:24px">${c.n}</h1></div><div class="card sl" style="text-align:center"><p style="margin:0">${c.q}</p><div class="big" id="bg">${c.f(c.v)}</div><input id="s-v" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.v}" data-k="v" aria-label="${c.q}"></div><p>We’ll play out 500 versions of your next 2 years with this happening.</p><button class="btn" data-act="run">Run the test</button>`},
sim(){return`<div class="c">${twin("bad",150,"wob")}<h1 style="margin-top:16px" id="sm">Waking up your twin…</h1><div class="pb"><i id="pg"></i></div></div>`},
res(){return`<div class="top"><button class="back" data-go="home" aria-label="Home">⌂</button><h2 style="margin:0">${SC[sc].n}: ${SC[sc].f(SC[sc].v)}</h2></div><div id="rs"></div><button class="btn" data-act="sheet">Make it safer</button><button class="btn alt" data-go="pick">Try another bad day</button>`},
hist(){return`<h1>History</h1><p>Your past stress tests.</p>${hist.length?hist.map((h,i)=>`<button class="hist" data-act="again" data-i="${i}"><span class="badge ${rm(h.risk)}">${h.risk}%</span><div><b>${SC[h.sc].n}</b><br><small style="color:var(--m)">${SC[h.sc].f(h.v)}, ${new Date(h.ts).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</small></div></button>`).join(""):`<div class="card c" style="min-height:0">${twin("mid",100)}<h2 style="margin-top:8px">No tests yet</h2><p>Run your first one and it shows up here.</p><button class="btn" data-go="pick">Start a test</button></div>`}`},
me(){return`<h1>Me</h1><div class="card"><div class="stat"><span>Earn</span><b>${money(S.earn)}</b></div><div class="stat"><span>Spend</span><b>${money(S.spend)}</b></div><div class="stat"><span>Loan payments</span><b>${money(S.loan)}</b></div><div class="stat"><span>Savings</span><b>${money(S.saved)}</b></div></div>
<button class="btn" data-act="edit">Edit my twin</button><button class="btn alt" data-act="theme">Switch theme</button><button class="btn alt" data-act="clear">Clear history</button><p style="margin-top:18px;font-size:13px">FinTwin is a college prototype. The numbers come from simplified assumptions, so treat them as possibilities, not predictions or financial advice.</p>`}};
const MAIN=["home","hist","me"],stack=[];
function go(n,dir=1,push=true){const el=document.createElement("div");el.className="scr "+(dir>0?"r":"l");el.innerHTML=V[n]();st.appendChild(el);const old=cur;
if(push&&old&&!MAIN.includes(n))stack.push(name);if(MAIN.includes(n))stack.length=0;name=n;cur=el;saved=n==="res"?saved:saved;
requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.remove("r","l");if(old){old.classList.add(dir>0?"l":"r");setTimeout(()=>old.remove(),340)}}));
$("#tabs").classList.toggle("hide",!MAIN.includes(n));document.querySelectorAll("#tabs [data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===n));$("#sheet").classList.remove("open");
if(n==="res")dyn();if(n==="sim"){const m=["Waking up your twin…","Applying the bad news…","Playing out 500 futures…","Counting the damage…"];let i=0;requestAnimationFrame(()=>$("#pg")&&($("#pg").style.width="100%"));
const t=setInterval(()=>{i++;$("#sm")&&($("#sm").textContent=m[Math.min(i,3)])},600);setTimeout(()=>{clearInterval(t);saved=false;go("res",1,false)},2500)}}
const back=()=>go(stack.pop()||"home",-1,false);
document.addEventListener("click",e=>{const b=e.target.closest("[data-go],[data-act]");if(!b)return;if(b.dataset.sc)sc=b.dataset.sc;const g=b.dataset.go,a=b.dataset.act;
if(g){if(MAIN.includes(g)&&name==="setup")done=true;go(g)}
else if(a==="back")back();else if(a==="obn"){ob++;ob>2?go("setup"):(cur.innerHTML=V.ob())}
else if(a==="made"){done=true;save();edit?(edit=false,go("me",-1,false)):go("home")}
else if(a==="run"){S.cut=0;S.add=0;go("sim")}
else if(a==="sheet"){const o=$("#sheet");o.innerHTML=`<h2>Make it safer</h2><p>Try these and watch the result change.</p><div class="sl">${sl({k:"cut",l:"Spend less each month",min:0,max:20000,step:500},S.cut,v=>v?money(v)+" less":"No change")}${sl({k:"add",l:"Build a bigger emergency fund",min:0,max:500000,step:10000},S.add,v=>v?"+"+money(v):"No change")}</div><p id="fxt" style="margin:14px 0 0;font-weight:700;color:var(--ink)"></p><button class="btn" data-act="shut">Done</button>`;o.classList.add("open");dyn()}
else if(a==="shut")$("#sheet").classList.remove("open");
else if(a==="again"){const h=hist[+b.dataset.i];sc=h.sc;SC[sc].v=h.v;go("cfg")}
else if(a==="edit"){edit=true;go("setup")}else if(a==="clear"){hist=[];save();cur.innerHTML=V.me()}
else if(a==="theme"){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"}});
let tm;document.addEventListener("input",e=>{const k=e.target.dataset.k;if(!k)return;const v=+e.target.value;
if(k==="v"){SC[sc].v=v;$("#bg").textContent=SC[sc].f(v)}else{S[k]=v;const o=$("#o-"+k);o.textContent=k==="cut"?(v?money(v)+" less":"No change"):k==="add"?(v?"+"+money(v):"No change"):money(v);if(k==="cut"||k==="add"){clearTimeout(tm);tm=setTimeout(()=>{saved=true;dyn()},100)}else save()}});
go(done?"home":"ob");
</script></body></html>
